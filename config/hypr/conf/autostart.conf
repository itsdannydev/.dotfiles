#################
### AUTOSTART ###
#################
# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:
# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox

# hyprpaper never exits (it's a daemon), so "hyprpaper && sleep 1 && ..." would never
# run anything after hyprpaper. That's why it is on its own line even though
# it is also part of setting the wallpaper. It shows themes/wallpapers/default.png
# straight away (see hyprpaper.conf).
exec-once = hyprpaper
# Login look: "themectl init" applies the accent colour calculated from default.png
# BEFORE waybar starts, so waybar opens already in the final colour (no recolour
# flash). No next-wallpaper here - that would move off the default.
# ";" not "&&": waybar must still start even if themectl init fails.
exec-once = ~/.config/hypr/scripts/themectl init; waybar

#something for screenshare
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
