# hyprpaper's first frame = the login wallpaper, themes/wallpapers/default.png.
# To change it, overwrite that file (cp some_wallpaper.png default.png); themectl
# init uses the same file and recalculates the accent from it at every login.
# Path must be absolute: hyprpaper can't resolve it relative to this config, so
# this assumes the repo is cloned at ~/.dotfiles (as the README says).
preload = ~/.dotfiles/themes/wallpapers/default.png
wallpaper = ,~/.dotfiles/themes/wallpapers/default.png
# syntax is wallpaper = monitor,absolute_path_to_image
# eg: wallpaper = eDP-1,/home/username/path
# leaving monitor blank will apply it to all monitors
